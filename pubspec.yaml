name: pulse
description: "Offline money, tasks and notes for one person."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

# Exact versions are pinned by the committed pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.1
  flutter_local_notifications: ^23.0.4
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  meta: ^1.19.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  shad: ^1.0.2
  share_plus: ^13.3.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  riverpod_generator: ^4.0.10

flutter:
  assets:
    - assets/licenses/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VF.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VF.ttf
          style: italic
