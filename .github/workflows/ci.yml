name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1' # keep equal to the local SDK
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart run tool/check_imports.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Release APK has no INTERNET permission
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          perms=$("$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk)
          echo "$perms"
          if echo "$perms" | grep -q 'android.permission.INTERNET'; then
            echo 'INTERNET permission found in the release APK'; exit 1
          fi
